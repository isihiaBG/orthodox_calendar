<title>Ударенията в „Разговори…“</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: една колона като църковна книга — думата е заглавието, примерът е текстът под нея. */
:root{
  --paper:#f6f3ee; --ink:#26221e; --muted:#6f675d; --rule:#ddd5c8;
  --cinnabar:#a8321f; --ok:#3f6b3a; --chip:#ece6dc; --card:#fffdf9;
  --display:"Alegreya",Georgia,"Times New Roman",serif;
  --body:"Alegreya Sans","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1c1a18; --ink:#ece6dc; --muted:#a49a8c; --rule:#3a3530;
  --cinnabar:#e0725c; --ok:#8cbf7f; --chip:#2b2723; --card:#232019; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1c1a18; --ink:#ece6dc; --muted:#a49a8c; --rule:#3a3530;
  --cinnabar:#e0725c; --ok:#8cbf7f; --chip:#2b2723; --card:#232019; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font:17px/1.5 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:2;padding-block:14px 10px;border-bottom:1px solid var(--rule)}
h1{font:700 1.45rem/1.2 var(--display);margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 10px}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tabs button{font:500 .88rem var(--body);border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.search{display:block;width:100%;box-sizing:border-box;margin-top:10px;font:400 1rem var(--body);color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:10px;padding:8px 12px}
.search:focus-visible{outline:2px solid var(--cinnabar);outline-offset:1px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.help{font-size:.9rem;color:var(--muted);margin:14px 0 4px}
.help b{color:var(--cinnabar);font-weight:700}
ol{list-style:none;margin:0;padding:0}
li.row{border-bottom:1px solid var(--rule);padding-block:14px;display:grid;gap:6px}
li.row.done{opacity:.55}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.word{font:500 1.6rem/1.1 var(--display);display:flex;flex-wrap:wrap}
.word span{padding:2px 1px}
.word button{font:inherit;color:inherit;background:none;border:0;padding:2px 3px;border-radius:4px;cursor:pointer;border-bottom:2px dotted var(--rule)}
.word button:hover,.word button:focus-visible{background:var(--chip);outline:none}
.word button.on{color:var(--cinnabar);border-bottom-color:var(--cinnabar)}
.word button.on::after{content:"\0301"}
.n{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;background:var(--chip);color:var(--muted);border-radius:4px;padding:1px 6px}
.state{margin-left:auto;font-size:.82rem;font-weight:700}
.state.ok{color:var(--ok)} .state.fix{color:var(--cinnabar)}
.ex{font-size:.95rem;color:var(--muted);margin:0}
.ex mark{background:none;color:var(--ink);font-weight:700}
.ex .lbl{font-weight:700;color:var(--cinnabar);margin-right:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{font:500 .9rem var(--body);border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.acts button.yes{border-color:var(--ok);color:var(--ok)}
.acts button:focus-visible,.tabs button:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px}
.more{display:block;margin:18px auto 0;font:500 1rem var(--body);background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.note{font-size:.88rem;color:var(--cinnabar);margin-top:8px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
<div class="wrap">
<header>
  <h1>Ударенията в „Разговори…“</h1>
  <p class="sub">Думите, на които ударението го сложи езиковият модел. Най-честите са отгоре.</p>
  <div class="bar"><i id="prog"></i></div>
  <div class="stats" id="stats"></div>
  <div class="tabs" role="group" aria-label="Филтър">
    <button id="t-todo" aria-pressed="true">Непрегледани</button>
    <button id="t-amb" aria-pressed="false">Двузначни</button>
    <button id="t-done" aria-pressed="false">Прегледани</button>
    <button id="t-all" aria-pressed="false">Всички</button>
  </div>
  <input id="q" class="search" type="search" placeholder="Търси дума…" autocomplete="off" spellcheck="false" aria-label="Търси дума">
  <p class="note" id="dbnote" hidden></p>
</header>
<p class="help">Докосни гласната, която трябва да е ударена — <b>а́</b>. Ако моделът е прав, натисни <b>✓ Вярно</b>.</p>
<ol id="list"></ol>
<button class="more" id="more" hidden>Покажи още</button>
</div>
<script id="data" type="application/json">

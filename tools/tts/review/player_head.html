<title>Слушай беседата</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Една колона текст като страница от книга; плейърът е лента отдолу,
   както мини плейърът в приложението. */
:root{
  --paper:#f6f3ec; --ink:#2a2622; --muted:#7a7066; --rule:#ddd4c6;
  --cinnabar:#a8432e; --glow:#efd9a6; --bar:#2f2b27; --bar-ink:#f3eee6;
  --serif:"Alegreya",Georgia,"Times New Roman",serif;
  --sans:"Alegreya Sans","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1c1a18; --ink:#e7e1d7; --muted:#9a9084; --rule:#3a3530;
  --cinnabar:#e08a6f; --glow:#4a3d22; --bar:#2c2925; --bar-ink:#f3eee6; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1c1a18; --ink:#e7e1d7; --muted:#9a9084; --rule:#3a3530;
  --cinnabar:#e08a6f; --glow:#4a3d22; --bar:#2c2925; --bar-ink:#f3eee6; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font:400 1.12rem/1.6 var(--serif);padding:0 16px}
.wrap{max-width:38rem;margin:0 auto;padding-block:24px 140px}
h1{font:600 1.5rem/1.25 var(--serif);text-wrap:balance;margin:0 0 4px}
.sub{font:400 .95rem var(--sans);color:var(--muted);margin:0 0 20px}
.p{margin:0 0 .85em;text-align:justify;hyphens:auto}
.p.head{font-style:italic;text-align:center;color:var(--muted)}
.who{display:block;font:700 .72rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--cinnabar);margin:1.1em 0 .2em}
.s{cursor:pointer;border-radius:4px;transition:background-color .2s}
.s:hover{background:color-mix(in srgb,var(--glow) 45%,transparent)}
.s.on{background:var(--glow)}
.nref{font:700 .7em var(--sans);color:var(--cinnabar);vertical-align:super}
h2{font:600 1.1rem var(--serif);margin:2em 0 .5em;padding-top:1em;border-top:1px solid var(--rule)}
.note{display:flex;gap:10px;align-items:flex-start;margin:0 0 .8em;font-size:.98rem}
.note button{flex:none}
.player{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--bar-ink);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));font:500 .9rem var(--sans)}
.row{max-width:38rem;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{background:transparent;color:var(--bar-ink);border:1px solid #6b635a;border-radius:999px;
  min-width:44px;height:44px;font:600 .95rem var(--sans);cursor:pointer;padding:0 12px}
.btn.play{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink);min-width:54px;font-size:1.15rem}
.btn:focus-visible,.s:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px}
.time{font-variant-numeric:tabular-nums;opacity:.85;min-width:6.5em}
.track{flex:1 1 100%;height:4px;background:#4b453f;border-radius:2px;cursor:pointer;order:9}
.track i{display:block;height:100%;width:0;background:var(--bar-ink);border-radius:2px}
label.tog{display:flex;align-items:center;gap:6px;margin-left:auto}
.nbtn{background:transparent;border:1px solid var(--rule);color:var(--ink);border-radius:999px;height:36px;min-width:36px;cursor:pointer;font:600 .9rem var(--sans)}
@media (prefers-reduced-motion:reduce){.s{transition:none}}
</style>
<div class="wrap">
  <h1 id="title">Беседа</h1>
  <p class="sub">Проба на четенето. Докосни изречение, за да слушаш оттам.</p>
  <div id="text"></div>
  <h2>Бележките под линия</h2>
  <div id="notes"></div>
</div>
<div class="player" role="region" aria-label="Плейър">
  <div class="row">
    <button class="btn" id="back" aria-label="Назад 5 секунди">−5</button>
    <button class="btn play" id="play" aria-label="Пусни">▶</button>
    <button class="btn" id="fwd" aria-label="Напред 5 секунди">+5</button>
    <span class="time" id="time">0:00 / 0:00</span>
    <label class="tog"><input type="checkbox" id="withNotes" checked> бележки</label>
    <div class="track" id="track"><i id="prog"></i></div>
  </div>
</div>
<audio id="a" preload="auto"></audio>
<audio id="na" preload="auto"></audio>
<script id="data" type="application/json">

# ⚠⚠ НЕ Е ПАМЕТТА. На 19.09.2026 билдът беше спиран ЧЕТИРИ пъти подред с
# „ниска памет" — но не от системата, а от наблюдателя на фоновите команди.
# Свалянето на тавана и спирането на демона НЕ помогнаха (спираха го и при
# 2 GB, със 7,9 GB свободни). Лекът е ДРУГ: билдът се пуска ОТКАЧЕН, в
# собствена сесия, тъй че наблюдателят не го следи:
#
#     (setsid bash -c "flutter build apk --release \
#        --target-platform android-arm64 > ЛОГ 2>&1; echo \$? > ГОТОВО" &)
#
# После се чака по ФАЙЛА „ГОТОВО", не по процес — чакащата команда може да
# бъде спряна, билдът продължава.
org.gradle.jvmargs=-Xmx3072m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
